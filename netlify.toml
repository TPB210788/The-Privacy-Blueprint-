# Netlify configuration for the TomorrowKit site.
# Static HTML: nothing to build, just publish the repository root.

[build]
  publish = "."

# Forms are detected from the deployed HTML (data-netlify="true" on the
# waitlist form), so no build plugin or API key is needed.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    Content-Security-Policy = "default-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; script-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The life-dashboard folder holds a private Claude artifact and its notes.
# Keep it off the public TomorrowKit site.
[[redirects]]
  from = "/life-dashboard/*"
  to = "/404.html"
  status = 404
  force = true
